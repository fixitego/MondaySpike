<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Monday Spike | 日期頁</title>
  <script>
    window.MONDAY_SPIKE_ASSET_VERSION = Date.now().toString();
    document.write('<link rel="stylesheet" href="./css/style.css?v=' + window.MONDAY_SPIKE_ASSET_VERSION + '" />');
  </script>
  <noscript><link rel="stylesheet" href="./css/style.css" /></noscript>
</head>
<body class="page-date">
  <div class="court-overlay" aria-hidden="true"></div>
  <div id="globalLoading" class="global-loading" hidden>
    <div class="loading-panel">
      <p>載入中...</p>
      <div class="loading-bar" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <main class="container">
    <header class="hero">
      <a href="./index.html" class="back-link">← 回日期列表</a>
      <h1 id="pageTitle">日期報名</h1>
      <p id="pageSubTitle">請假、額外報名與最終名單都在此頁操作。</p>
      <p id="pageError" class="error-text" hidden></p>
    </header>

    <section class="panel panel-media panel-members">
      <h2>固定人員名單（請假）</h2>
      <p class="note">左男右女，每位人員每日期僅能送出一次請假。</p>
      <div class="split-two">
        <div>
          <h3 class="subhead">男生</h3>
          <div id="memberListMale" class="member-list" aria-live="polite"></div>
        </div>
        <div>
          <h3 class="subhead">女生</h3>
          <div id="memberListFemale" class="member-list" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section class="panel panel-media panel-extra">
      <h2>額外報名</h2>
      <form id="extraForm" class="form-grid">
        <label for="extraType">補位類型</label>
        <select id="extraType" required>
          <option value="MALE">男生 1 位</option>
          <option value="FEMALE">女生 1 位</option>
          <option value="PAIR">1 男 1女</option>
        </select>

        <div id="maleField">
          <label for="maleName">男生姓名</label>
          <input id="maleName" type="text" maxlength="50" />
        </div>

        <div id="femaleField">
          <label for="femaleName">女生姓名</label>
          <input id="femaleName" type="text" maxlength="50" />
        </div>

        <label id="pairRuleField" class="checkbox-line"><input id="pairMustTogether" type="checkbox" /> 一男一女需同時補上，否則放棄</label>

        <label for="extraNote">備註</label>
        <input id="extraNote" type="text" maxlength="120" placeholder="例如：候補、只能 20:00 後到場" />

        <button id="extraSubmitBtn" class="btn primary" type="submit">送出額外報名</button>
      </form>
    </section>

    <section class="panel panel-media panel-extra">
      <div class="row between">
        <h2>額外報名清單</h2>
        <button id="refreshExtraBtn" class="btn icon-btn" type="button" title="刷新額外報名">↻</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>類型</th>
              <th>姓名</th>
              <th>狀態</th>
              <th>備註</th>
            </tr>
          </thead>
          <tbody id="extraListBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel panel-media panel-final">
      <div class="row between">
        <h2>最終人員名單</h2>
        <div class="row gap">
          <button id="triggerSettlementBtn" class="btn" type="button">觸發結算</button>
          <button id="refreshFinalBtn" class="btn icon-btn" type="button" aria-label="刷新最終名單" title="刷新最終名單">↻</button>
        </div>
      </div>
      <p id="settlementInfo" class="note"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>性別</th>
              <th>來源</th>
            </tr>
          </thead>
          <tbody id="finalListBody"></tbody>
        </table>
      </div>
      <p id="finalSummary" class="final-summary"></p>
    </section>

    <section class="panel panel-media panel-final">
      <details id="auditSection">
        <summary>異動紀錄（請假 / 額外報名）</summary>
        <div class="row between audit-head">
          <p class="note">預設收合，點開可檢視該日期的新增/取消時間。</p>
          <button id="refreshAuditBtn" class="btn icon-btn" type="button" title="刷新異動紀錄">↻</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>時間</th>
                <th>類別</th>
                <th>動作</th>
                <th>內容</th>
              </tr>
            </thead>
            <tbody id="auditBody"></tbody>
          </table>
        </div>
      </details>
    </section>
  </main>

  <footer class="site-footer">
    <p>Monday Spike Club</p>
    <p>Today we connect. Tomorrow we fly.</p>
  </footer>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    document.write('<script src="./js/app.js?v=' + window.MONDAY_SPIKE_ASSET_VERSION + '"><\/script>');
  </script>
</body>
</html>
