<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Monday Spike | 日期入口</title>
  <script>
    window.MONDAY_SPIKE_ASSET_VERSION = Date.now().toString();
    document.write('<link rel="stylesheet" href="./css/style.css?v=' + window.MONDAY_SPIKE_ASSET_VERSION + '" />');
  </script>
  <noscript><link rel="stylesheet" href="./css/style.css" /></noscript>
</head>
<body class="page-home">
  <div class="court-overlay" aria-hidden="true"></div>
  <div id="globalLoading" class="global-loading" hidden>
    <div class="loading-panel">
      <p>載入中...</p>
      <div class="loading-bar" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <header class="hero hero-banner full-bleed">
    <div class="hero-inner container">
      <h1 class="hero-fixed-title">MONDAY SPIKE 排球團練報名</h1>
      <div class="hero-track" aria-hidden="true">
        <img src="./assets/images/home-banner.svg" alt="" />
        <img src="./assets/images/home-banner-2.svg" alt="" />
        <img src="./assets/images/home-banner-3.svg" alt="" />
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel panel-media panel-dates">
      <h2>快速選擇日期</h2>
      <p class="note">以下按鈕來自 Google Sheet 的 `available_dates`。</p>
      <div id="dateList" class="date-grid" aria-live="polite"></div>
    </section>

    <section class="panel panel-media panel-custom">
      <h2>自訂日期（限清單內）</h2>
      <div class="row gap stack-mobile">
        <select id="customDateSelect" aria-label="選擇可用日期"></select>
        <button id="goDateBtn" class="btn primary" type="button">進入日期頁面</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Monday Spike Club</p>
    <p>Powered by LIFF + Google Sheets</p>
  </footer>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    document.write('<script src="./js/app.js?v=' + window.MONDAY_SPIKE_ASSET_VERSION + '"><\/script>');
  </script>
</body>
</html>
